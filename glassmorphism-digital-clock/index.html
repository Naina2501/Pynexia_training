
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Morphism Digital Clock</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="clock-card">
    <p class="eyebrow">LOCAL TIME</p>
    <h1>Glass Morphism Digital Clock</h1>

    <div class="clock-face">
      <div id="second-hand" class="hand"></div>
      <div class="clock-center"></div>
    </div>

    <div id="digital-time" class="digital-time">--:--:--</div>
    <p id="date-line">Loading date...</p>

    <button id="format-toggle" type="button">
      Switch to 24-hour
    </button>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
