
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search beautiful photographs by keyword.">
  <title>PixelFind | Image Search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">Pixel<span>Find</span></a>
    <span class="topbar-note">Discover something beautiful</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">YOUR VISUAL DISCOVERY TOOL</p>
      <h1>Find images that<br><em>inspire you.</em></h1>
      <p class="subtitle">Explore photographs from around the world.</p>

      <form id="search-form" class="search-form">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search"
          placeholder="Search nature, architecture, travel..."
          aria-label="Search images" autocomplete="off" required>
        <button type="submit">Search</button>
      </form>

      <div class="suggestions">
        <span>Try:</span>
        <button type="button" data-query="nature">Nature</button>
        <button type="button" data-query="architecture">Architecture</button>
        <button type="button" data-query="travel">Travel</button>
        <button type="button" data-query="minimal">Minimal</button>
      </div>
    </section>

    <section class="results-section" aria-label="Image search results">
      <div class="results-heading">
        <div>
          <h2 id="results-title">Explore images</h2>
          <p id="results-count">Search for something you love.</p>
        </div>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
      <div id="image-grid" class="image-grid"></div>

      <button id="load-more" class="load-more" type="button" hidden>
        Load more
      </button>
    </section>
  </main>

  <div id="lightbox" class="lightbox" role="dialog"
    aria-modal="true" aria-label="Image preview" >
    <button id="close-lightbox" class="close-button"
      type="button" aria-label="Close image preview">×</button>
    <figure>
      <img id="lightbox-image" src="" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <footer>
    <p>PixelFind · Made for visual inspiration</p>
    <p class="credit">Photos provided by Unsplash</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
