<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">
            <i class="fa-solid fa-list-check"></i>
            <h1>Task Manager</h1>
        </div>

        <div class="header-right">

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Tasks..."
                >
            </div>

            <button id="themeBtn">
                <i class="fa-solid fa-moon"></i>
            </button>

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- LEFT PANEL -->

        <aside class="sidebar">

            <!-- Add Task -->

            <section class="card">

                <h2>Add New Task</h2>

                <form id="taskForm">

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Task Title"
                        required
                    >

                    <textarea
                        id="taskDescription"
                        placeholder="Task Description"
                    ></textarea>

                    <input
                        type="date"
                        id="taskDate"
                    >

                    <select id="taskPriority">

                        <option value="High">High</option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>

                    <button type="submit">
                        Add Task
                    </button>

                </form>

            </section>

            <!-- Statistics -->

            <section class="card">

                <h2>Statistics</h2>

                <div class="stats">

                    <div>
                        <h3 id="totalTasks">0</h3>
                        <p>Total</p>
                    </div>

                    <div>
                        <h3 id="completedTasks">0</h3>
                        <p>Completed</p>
                    </div>

                    <div>
                        <h3 id="pendingTasks">0</h3>
                        <p>Pending</p>
                    </div>

                </div>

            </section>

        </aside>

        <!-- RIGHT PANEL -->

        <section class="content">

            <!-- Filters -->

            <div class="filters">

                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>

            </div>

            <!-- Task List -->

            <div
                id="taskList"
                class="task-list"
            >

                <!-- JavaScript will render tasks here -->

            </div>

        </section>

    </main>

    <!-- Footer -->

    <footer>

        <p>© 2026 Task Manager | Built with HTML, CSS & JavaScript</p>

    </footer>

    <!-- JavaScript -->

    <script type="module" src="js/app.js"></script>

</body>
</html>
